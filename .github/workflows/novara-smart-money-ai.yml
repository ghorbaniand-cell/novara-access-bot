name: NOVARA Smart Money AI — Validate Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker and webhook syntax
        run: |
          node --check novara_smart_money_ai.mjs
          node --check vps/tradingview-webhook.mjs
      - name: Confirm required package files
        run: |
          test -s novara_smart_money_ai.mjs
          test -s vps/tradingview-webhook.mjs
          test -s tradingview/NOVARA_Market_Structure_Gate.pine
          test -s systemd/novara-scan.service
          test -s systemd/novara-scan.timer
          echo 'Package files present. Pine Script must be compiled/tested in TradingView Pine Editor.'
