name: Arbitrum RPC Read-only Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-check:
    runs-on: ubuntu-latest

    steps:
      - name: Test Arbitrum One RPC
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          RPC_URL = "https://arbitrum.drpc.org"

          def rpc_call(method):
              payload = {
                  "jsonrpc": "2.0",
                  "method": method,
                  "params": [],
                  "id": 1
              }

              request = urllib.request.Request(
                  RPC_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "NOVARA-RPC-Test/1.0"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=20
                  ) as response:
                      body = response.read().decode("utf-8")
                      result = json.loads(body)

              except urllib.error.HTTPError as error:
                  print(f"RPC URL: {RPC_URL}")
                  print(f"HTTP STATUS: {error.code}")
                  print(f"HTTP REASON: {error.reason}")

                  try:
                      body = error.read().decode(
                          "utf-8", errors="replace"
                      )
                      print("SERVER RESPONSE:", body[:1000])
                  except Exception:
                      print("Could not read server response.")

                  print(
                      "SERVER HEADER:",
                      error.headers.get("Server")
                  )
                  print(
                      "CONTENT TYPE:",
                      error.headers.get("Content-Type")
                  )
                  raise

              except Exception as error:
                  print(f"RPC URL: {RPC_URL}")
                  print(
                      f"CONNECTION ERROR: "
                      f"{type(error).__name__}: {error}"
                  )
                  raise

              if "error" in result:
                  raise RuntimeError(
                      f"JSON-RPC error: {result['error']}"
                  )

              if "result" not in result:
                  raise RuntimeError(
                      f"Unexpected RPC response: {result}"
                  )

              return result["result"]

          try:
              print("Testing Arbitrum One RPC...")
              print("RPC endpoint:", RPC_URL)

              chain_id = rpc_call("eth_chainId")
              print("Connected chain ID:", chain_id)

              if int(chain_id, 16) != 42161:
                  raise RuntimeError(
                      "Wrong network! Expected Arbitrum One "
                      "(Chain ID 42161)."
                  )

              block_number = rpc_call("eth_blockNumber")
              print(
                  "Latest block number:",
                  int(block_number, 16)
              )

              print("ARBITRUM_RPC_TEST_SUCCESS")

          except Exception:
              print("ARBITRUM_RPC_TEST_FAILED")
              raise
          PY
