name: Arbitrum RPC Read-only Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-check:
    runs-on: ubuntu-latest

    steps:
      - name: Test Arbitrum One RPC
        run: |
          python - <<'PY'
          import json
          import urllib.request

          RPC_URL = "https://arbitrum-one-rpc.publicnode.com"

          def rpc_call(method):
              payload = {
                  "jsonrpc": "2.0",
                  "method": method,
                  "params": [],
                  "id": 1
              }

              request = urllib.request.Request(
                  RPC_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              if "error" in result:
                  raise RuntimeError(
                      f"RPC error: {result['error']}"
                  )

              return result["result"]

          try:
              chain_id = rpc_call("eth_chainId")

              print(f"Connected chain ID: {chain_id}")

              if int(chain_id, 16) != 42161:
                  raise RuntimeError(
                      "Wrong network! Expected Arbitrum One."
                  )

              block_number = rpc_call("eth_blockNumber")

              print(
                  "Latest block number:",
                  int(block_number, 16)
              )

              print("ARBITRUM_RPC_TEST_SUCCESS")

          except Exception as error:
              print("ARBITRUM_RPC_TEST_FAILED")
              raise error
          PY
