name: NOVARA Smart Money AI

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: novara-smart-money-ai
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository and persistent state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run NOVARA observer
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOVARA_VIP_CHAT_ID: ${{ vars.NOVARA_VIP_CHAT_ID }}
          NOVARA_FREE_CHAT_ID: ${{ vars.NOVARA_FREE_CHAT_ID }}
          VIP_CHAT_ID: ${{ vars.VIP_CHAT_ID }}
          FREE_CHAT_ID: ${{ vars.FREE_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          NOVARA_SMART_REQUEST_GAP_MS: '300'
          NOVARA_PREDICTIVE_MIN_STRENGTH: '61'
          NOVARA_FORECAST_DEADBAND_PCT: '0.10'
          NOVARA_FORECAST_MAX_LATE_15M: '7'
          NOVARA_FORECAST_MAX_LATE_60M: '12'
          NOVARA_PREDICTIVE_MIN_EDGE_GAP: '12'
          NOVARA_SMART_MIN_SCORE: '6.0'
          NOVARA_SMART_MIN_RR: '1.5'
          NOVARA_REVERSE_BREAKOUT_ONLY: 'true'
          NOVARA_PAPER_MAX_HOLD_HOURS: '24'
        shell: bash
        run: |
          set -euo pipefail
          echo "NOVARA probabilistic next-move observer"
          node --version
          node novara_smart_money_ai.mjs

      - name: Persist paper outcomes and window-validated forecast ledger
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATE='production/state/novara_smart_money_state.json'
          if [ -f "$STATE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$STATE"
            if ! git diff --cached --quiet; then
              git commit -m "Persist NOVARA paper outcomes and forecast research ledger [skip ci]"
              git push
            else
              echo "No state changes to persist."
            fi
          else
            echo "State file not created; nothing to persist."
          fi
