name: NOVARA Shadow Forecast

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novara-shadow-forecast
  cancel-in-progress: false

jobs:
  shadow-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore isolated shadow ledger
        uses: actions/cache/restore@v4
        with:
          path: production/shadow
          key: novara-shadow-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            novara-shadow-${{ github.ref }}-
      - name: Run read-only forecast experiment
        run: node novara_shadow_forecast.mjs
        env:
          NOVARA_SHADOW_DIR: production/shadow
          NOVARA_SHADOW_REQUEST_GAP_MS: '300'
          NOVARA_SHADOW_WORKERS: '4'
          NOVARA_SHADOW_MAX_MARKETS: '0'
          NOVARA_SHADOW_DEADBAND_PCT: '0.10'
          NOVARA_SHADOW_MAX_FEATURE_AGE_MIN: '45'
      - name: Save isolated shadow ledger
        uses: actions/cache/save@v4
        with:
          path: production/shadow
          key: novara-shadow-${{ github.ref }}-${{ github.run_id }}
      - name: Publish scorecard and ledger artifact
        uses: actions/upload-artifact@v4
        with:
          name: novara-shadow-forecast-${{ github.run_id }}
          path: production/shadow/scorecard.json
          retention-days: 90
          if-no-files-found: error
