name: NOVARA Bot Test

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow deliberately NEVER starts Telegram polling.
# The persistent NOVARA bot should be the only process calling getUpdates.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify bot source compiles without starting it
        run: python -m py_compile bot.py

      - name: Confirm test is polling-safe
        shell: bash
        run: |
          set -euo pipefail
          test -f bot.py
          echo "NOVARA source check passed."
          echo "Telegram polling was NOT started; no bot token is needed in this workflow."
