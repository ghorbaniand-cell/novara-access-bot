name: NOVARA Meme Coin Hunter — Solana + TON

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: novara-meme-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout repository and persistent hunter state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Hunter logic
        env:
          HUNTER_SELF_TEST: '1'
        shell: bash
        run: |
          set -euo pipefail
          node --check novara_meme_hunter.mjs
          node novara_meme_hunter.mjs

      - name: Run NOVARA Meme Hunter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          NOVARA_CHAT_ID: ${{ vars.NOVARA_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          PUMPPORTAL_API_KEY: ${{ secrets.PUMPPORTAL_API_KEY }}
          HUNTER_PUMPPORTAL_LISTEN_MS: '45000'
          HUNTER_PRELAUNCH_MIN_VSOL: '50'
          HUNTER_PRELAUNCH_MIN_MCAP_SOL: '100'
          HUNTER_SCAN_LIMIT: '12'
          HUNTER_MAX_AGE_HOURS: '72'
          HUNTER_MIN_LIQUIDITY_USD: '1500'
          HUNTER_GECKO_MIN_INTERVAL_MS: '10000'
          HUNTER_MIN_BUY_VOLUME_15M_USD: '500'
          HUNTER_MIN_BUYS_24H: '8'
          HUNTER_MIN_UNIQUE_BUYERS: '6'
          HUNTER_MAX_TOP10_HOLDER_PCT: '55' # diagnostic threshold only; no hard rejection
          HUNTER_MIN_SCORE: '72'
          HUNTER_ALERT_COOLDOWN_HOURS: '6'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node novara_meme_hunter.mjs

      - name: Persist discovery history and candidate ledger
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATE='data/meme_hunter_state.json'
          if [ -f "$STATE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$STATE"
            if ! git diff --cached --quiet; then
              git commit -m "Persist NOVARA meme hunter ledger [skip ci]"
              git push
            else
              echo "No hunter state changes to persist."
            fi
          else
            echo "Hunter state not created; nothing to persist."
          fi
