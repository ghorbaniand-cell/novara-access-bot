name: NOVARA Meme Hunter — Event First Solana

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows have a practical 5-minute minimum cadence.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: novara-meme-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout repository and persisted event ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check and self-test
        env:
          HUNTER_SELF_TEST: '1'
        run: |
          set -euo pipefail
          node --check novara_meme_hunter.mjs
          node novara_meme_hunter.mjs

      - name: Run event-first discovery
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          NOVARA_CHAT_ID: ${{ vars.NOVARA_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          PUMPPORTAL_API_KEY: ${{ secrets.PUMPPORTAL_API_KEY }}
          HUNTER_LISTEN_MS: '250000'
          HUNTER_SCAN_LIMIT: '100'
          HUNTER_PROFILE_LIMIT: '100'
          HUNTER_MIN_DEV_SCORE: '22'
          HUNTER_MIN_POOL_SCORE: '70'
          HUNTER_MAX_DEV_CHECKS_PER_RUN: '15'
          HUNTER_MAX_DEV_CHECKS_PER_DAY: '200'
        run: |
          set -euo pipefail
          node --version
          node novara_meme_hunter.mjs

      - name: Persist launch and pool lifecycle ledger
        if: always()
        run: |
          set -euo pipefail
          STATE='data/meme_hunter_state.json'
          if [ -f "$STATE" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$STATE"
            if ! git diff --cached --quiet; then
              git commit -m "Persist NOVARA event-first hunter ledger [skip ci]"
              git push
            else
              echo "No hunter state changes to persist."
            fi
          else
            echo "No hunter state file created."
          fi
