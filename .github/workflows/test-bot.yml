name: NOVARA Bot Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novara-telegram-bot-polling
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NOVARA bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VIP_CHANNEL_ID: ${{ secrets.VIP_CHANNEL_ID }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 4m python -u bot.py
          result=$?

          if [ "$result" -eq 124 ] || [ "$result" -eq 143 ]; then
            echo "NOVARA bot stopped after the planned test interval."
            exit 0
          fi

          if [ "$result" -ne 0 ]; then
            echo "NOVARA bot exited with error code: $result"
            exit "$result"
          fi

          echo "NOVARA bot exited normally."
