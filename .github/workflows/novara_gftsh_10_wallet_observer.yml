name: GFTSH 10 Wallet Observer

# Name deliberately retained for continuity with the existing workflow.
# The observer monitors 28 wallets, every 5 minutes (best-effort GitHub schedule).

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gftsh-10-wallet-observer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify observer
        shell: bash
        run: |
          set -e
          test -f gftsh_10_wallet_observer.mjs
          node --check gftsh_10_wallet_observer.mjs
          echo "Workflow: ${{ github.workflow }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Expected scan cadence: every 5 minutes"

      - name: Ensure state directory
        run: mkdir -p production/state

      - name: Run 28-wallet observer
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOVARA_FREE_CHAT_ID: ${{ vars.NOVARA_FREE_CHAT_ID }}
          NOVARA_VIP_CHAT_ID: ${{ vars.NOVARA_VIP_CHAT_ID }}
          NOVARA_FREE_DAILY_LIMIT: '5'
          NOVARA_VIP_DAILY_LIMIT: '100'
          NOVARA_PUBLISH_STATE_FILE: production/state/novara_publish_state.json
          HYPERLIQUID_API_URL: ${{ vars.HYPERLIQUID_API_URL }}
          GFTSH_SCAN_INTERVAL_MIN: '5'
          GFTSH_LOOKBACK_MIN: ${{ vars.GFTSH_LOOKBACK_MIN }}
          GFTSH_ENTRY_BAND_PCT: '1.0'
          GFTSH_REQUEST_GAP_MS: ${{ vars.GFTSH_REQUEST_GAP_MS }}
          GFTSH_REQUEST_TIMEOUT_MS: ${{ vars.GFTSH_REQUEST_TIMEOUT_MS }}
          GFTSH_RETRIES: ${{ vars.GFTSH_RETRIES }}
          GFTSH_RETRY_BASE_MS: ${{ vars.GFTSH_RETRY_BASE_MS }}
          GFTSH_MIN_ALERT_NOTIONAL_USD: ${{ vars.GFTSH_MIN_ALERT_NOTIONAL_USD }}
          GFTSH_TELEGRAM_MAX_CHARS: ${{ vars.GFTSH_TELEGRAM_MAX_CHARS }}
          GFTSH_SEND_STARTUP_STATUS: ${{ vars.GFTSH_SEND_STARTUP_STATUS }}
          GFTSH_WATCH_STATE_FILE: production/state/gftsh_10_wallet_observer.json
          GFTSH_WATCH_TELEGRAM_STATE_FILE: production/state/gftsh_10_wallet_telegram.json
        shell: bash
        run: |
          set -e
          echo "GFTSH 28-WALLET OBSERVER — START"
          echo "Node: $(node --version)"
          echo "Trigger: ${{ github.event_name }}"
          echo "Workflow name retained: GFTSH 10 Wallet Observer"
          echo "Entry band: 1.00%"
          node gftsh_10_wallet_observer.mjs

      - name: Persist observer state
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p production/state
          [ ! -f production/state/gftsh_10_wallet_observer.json ] || git add -f production/state/gftsh_10_wallet_observer.json
          [ ! -f production/state/gftsh_10_wallet_telegram.json ] || git add -f production/state/gftsh_10_wallet_telegram.json
          [ ! -f production/state/novara_publish_state.json ] || git add -f production/state/novara_publish_state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: persist GFTSH 31-wallet observer state"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Notify Telegram on workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram failure notification skipped: secrets are not configured."
            exit 0
          fi
          payload=$(node -e 'console.log(JSON.stringify({chat_id:process.env.TELEGRAM_CHAT_ID,text:"🚨 GFTSH 28-wallet observer workflow FAILED\nRepository: " + process.env.GITHUB_REPOSITORY + "\nRun: " + process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID}))')
          curl --fail --silent --show-error --max-time 15 -H 'Content-Type: application/json' -X POST --data "$payload" "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
